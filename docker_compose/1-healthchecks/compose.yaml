version: '3.8'

services:
  db:
    build: ./db
    env_file: ./db/.env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  api:
    build: ./api
    env_file: ./api/.env
    depends_on:
      db:
        condition: service_healthy
        restart: true
    networks:
      - app_network
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    depends_on:
      - api
    networks:
      - app_network
    ports:
      - "8080:80"

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
