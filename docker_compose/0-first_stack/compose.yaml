version: '3.8'

services:
  db:
    build: ./db
    env_file: ./db/.env
    environment:
      DB_START_DELAY: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network

  api:
    build: ./api
    env_file: ./api/.env
    depends_on:
      - db
    networks:
      - app_network
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    depends_on:
      - api
    networks:
      - app_network
    ports:
      - "8080:80"

networks:
  app_network:
    driver: bridge

volumes:
  db_data: