services:
  db:
    image: postgres:16
    env_file: ./db/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  cache:
    image: redis:7-alpine

  web:
    image: nginx:alpine
    ports:
      - "8081:80"

  api:
    image: nginx:alpine
    ports:
      - "8080:8080"
    depends_on:
      - db

