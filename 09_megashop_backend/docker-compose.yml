version: '3.8'

services:
  cache-queue:
    image: redis:alpine
    container_name: megashop_cache_queue
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - megashop_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-webhook:
    build: .
    container_name: megashop_api_webhook
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://cache-queue:6379
      - NODE_ENV=production
      - PORT=3000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_BASEURL=${LANGFUSE_BASE_URL}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - cache-queue
    networks:
      - megashop_network

  async-worker:
    build: .
    container_name: megashop_async_worker
    restart: unless-stopped
    command: node worker.js
    environment:
      - REDIS_URL=redis://cache-queue:6379
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_BASEURL=${LANGFUSE_BASEURL}
    depends_on:
      cache-queue:
        condition: service_healthy
    networks:
      - megashop_network

volumes:
  redis_data:

networks:
  megashop_network:
    driver: bridge
